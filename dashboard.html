<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2E6; --grid:#DCE4D1; --grid-major:#C9D5BC; --card:#FBFCF8;
  --ink:#1F2A44; --ink-soft:#56617A; --rule:#B8C4AA;
  --s-ns:#FBFCF8; --s-ip:#F2D24B; --s-done:#7DBB86; --s-pause:#B9ACD6;
  --s-ns-ink:#1F2A44; --s-ip-ink:#2A2410; --s-done-ink:#10301A; --s-pause-ink:#241B3D;
  --pin:#D6453D; --focus-ring:#2C62D8;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-label:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#18202E; --grid:#212B3B; --grid-major:#2A3548; --card:#1F2838;
    --ink:#E3E8DA; --ink-soft:#9AA5B8; --rule:#3A465C;
    --s-ns:#1F2838; --s-ip:#C9A92E; --s-done:#4E9360; --s-pause:#7E6FA8;
    --s-ns-ink:#E3E8DA; --s-ip-ink:#1B1604; --s-done-ink:#07190C; --s-pause-ink:#0F0A1E;
    --pin:#F0675F; --focus-ring:#7FA6FF;
  }
}
:root[data-theme="dark"]{
  --paper:#18202E; --grid:#212B3B; --grid-major:#2A3548; --card:#1F2838;
  --ink:#E3E8DA; --ink-soft:#9AA5B8; --rule:#3A465C;
  --s-ns:#1F2838; --s-ip:#C9A92E; --s-done:#4E9360; --s-pause:#7E6FA8;
  --s-ns-ink:#E3E8DA; --s-ip-ink:#1B1604; --s-done-ink:#07190C; --s-pause-ink:#0F0A1E;
  --pin:#F0675F; --focus-ring:#7FA6FF;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; color:var(--ink); font:16px/1.5 var(--font-body);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
a{color:inherit}

/* ---------- header + tabs ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink)}
.bar{display:flex;align-items:baseline;gap:1rem;padding:.9rem 1.25rem .4rem;flex-wrap:wrap}
.bar h1{font:700 1.9rem/1 var(--font-label);margin:0;letter-spacing:.01em}
.bar .overall{color:var(--ink-soft);font-size:.9rem}
.bar .spacer{flex:1}
.textbtn{background:none;border:1.5px solid var(--ink);border-radius:4px;padding:.25rem .7rem;cursor:pointer;font-size:.9rem}
.textbtn:hover{background:var(--card)}
.tabs{display:flex;gap:.25rem;padding:0 1rem;overflow-x:auto;scrollbar-width:thin}
.tab{
  flex:none;border:2px solid var(--ink);border-bottom:none;border-radius:8px 8px 0 0;
  background:var(--grid);padding:.4rem .9rem .35rem;cursor:pointer;
  font:600 1.05rem/1.2 var(--font-label);display:flex;gap:.45rem;align-items:baseline;
  position:relative;top:2px;
}
.tab .pct{font:400 .8rem var(--font-body);color:var(--ink-soft)}
.tab[aria-selected="true"]{background:var(--paper);z-index:1}
.tab.focus-tab{margin-left:auto}
.tab.focus-tab .dot{color:var(--pin)}

main{padding:1.25rem 1.25rem 4rem}
.subject-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem 1.25rem;margin-bottom:1rem}
.subject-head h2{font:700 1.6rem/1.1 var(--font-label);margin:0}
.subject-head .meta{color:var(--ink-soft);font-size:.92rem}
.legend{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.85rem;color:var(--ink-soft);margin-left:auto}
.legend span{display:inline-flex;gap:.35rem;align-items:center}
.swatch{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:3px;display:inline-block}

/* ---------- boxes ---------- */
.box{
  display:flex;align-items:flex-start;gap:.5rem;width:100%;text-align:left;cursor:pointer;
  border:1.5px solid var(--ink);border-radius:5px;padding:.45rem .6rem;min-height:44px;
  background:var(--s-ns);color:var(--s-ns-ink);position:relative;font-size:.9rem;line-height:1.3;
}
.box:hover{box-shadow:3px 3px 0 var(--ink)}
.box .g{flex:none;width:1.1em;text-align:center;font-weight:700}
.box .t{flex:1}
.box .pin{flex:none;color:var(--pin);font-size:.95rem;line-height:1.2}
.box.s-ip{background:var(--s-ip);color:var(--s-ip-ink)}
.box.s-done{background:var(--s-done);color:var(--s-done-ink)}
.box.s-pause{background:var(--s-pause);color:var(--s-pause-ink);
  background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.08) 6px 8px)}
.box.s-ns{border-style:dashed}
.box.selected{outline:3px solid var(--focus-ring);outline-offset:2px}
.box.unitbox{font:600 1.05rem/1.2 var(--font-label);border-width:2px}
.box.unitbox .code{display:block;font:500 .8rem var(--font-body);opacity:.75}
.count{font:400 .78rem var(--font-body);opacity:.8;white-space:nowrap}

/* ---------- flow layout ---------- */
.lane{margin-bottom:1.75rem}
.lane-head{max-width:32rem;margin-bottom:.6rem;display:flex;gap:.5rem;align-items:stretch}
.lane-head .box{flex:1}
.lane.open .toggle span{transform:rotate(90deg)}
.lane:not(.open){margin-bottom:.6rem}
.flow{display:flex;align-items:flex-start;gap:44px;overflow-x:auto;padding:.25rem .25rem 1rem}
.stage{flex:none;width:210px;display:flex;flex-direction:column;gap:.45rem;position:relative}
.stage + .stage::before{
  content:"";position:absolute;left:-38px;top:22px;width:28px;border-top:2px solid var(--ink);
}
.stage + .stage::after{
  content:"";position:absolute;left:-14px;top:17px;border:6px solid transparent;border-left:8px solid var(--ink);
}
.stage .lessons{display:flex;flex-direction:column;gap:.4rem;padding-left:.7rem;border-left:2px solid var(--rule);margin-left:.6rem}

/* ---------- stack layout ---------- */
.stack-tools{display:flex;gap:.5rem;margin-bottom:.75rem}
.unit{border:2px solid var(--ink);border-radius:6px;background:var(--card);margin-bottom:.6rem}
.unit-head{display:flex;align-items:stretch;gap:.5rem;padding:.5rem}
.toggle{flex:none;width:44px;border:1.5px solid var(--ink);border-radius:5px;background:none;cursor:pointer;font-size:1.1rem}
.toggle span{display:inline-block;transition:transform .15s}
.unit.open .toggle span{transform:rotate(90deg)}
.unit-head .box{flex:1}
.bar-mini{height:6px;border:1px solid var(--ink);border-radius:3px;overflow:hidden;display:flex;margin-top:.35rem;background:var(--s-ns)}
.bar-mini i{display:block;height:100%}
.chain{display:none;flex-wrap:wrap;align-items:center;gap:.4rem;padding:0 .75rem .75rem 3.9rem}
.unit.open .chain{display:flex}
.chain .box{width:auto;max-width:15rem}
.chain .arrow{color:var(--ink-soft);font-weight:700}

/* ---------- focus tab ---------- */
.focus-group{margin-bottom:1.5rem}
.focus-group h3{font:700 1.25rem var(--font-label);margin:0 0 .5rem}
.focus-list{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr))}
.fcard{border:2px solid var(--ink);border-radius:6px;background:var(--card);padding:.6rem;display:flex;flex-direction:column;gap:.4rem}
.fcard .crumb{font-size:.8rem;color:var(--ink-soft)}
.fcard p{margin:0;font-size:.88rem;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{max-width:34rem;border:2px dashed var(--ink);border-radius:6px;padding:1.25rem;background:var(--card)}

/* ---------- drawer ---------- */
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(400px,100%);z-index:40;
  background:var(--card);border-left:2px solid var(--ink);
  padding:calc(1rem + env(safe-area-inset-top,0px)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom,0px));
  overflow-y:auto;transform:translateX(105%);transition:transform .2s ease;
}
.drawer.open{transform:none;box-shadow:-6px 0 0 rgba(0,0,0,.08)}
.drawer .close{position:absolute;top:calc(.75rem + env(safe-area-inset-top,0px));right:.75rem;width:40px;height:40px;border:1.5px solid var(--ink);border-radius:5px;background:none;cursor:pointer;font-size:1.2rem}
.drawer .crumb{font-size:.85rem;color:var(--ink-soft);margin-right:3rem}
.drawer h2{font:700 1.5rem/1.15 var(--font-label);margin:.2rem 3rem .9rem 0}
.drawer h3{font:600 1rem var(--font-label);margin:1.1rem 0 .4rem;font-size:1.1rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
.seg button{border:1.5px solid var(--ink);border-radius:5px;padding:.45rem;cursor:pointer;text-align:left;display:flex;gap:.4rem;align-items:center}
.seg button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);font-weight:700}
.seg .s-ns{background:var(--s-ns);color:var(--s-ns-ink);border-style:dashed}
.seg .s-ip{background:var(--s-ip);color:var(--s-ip-ink)}
.seg .s-done{background:var(--s-done);color:var(--s-done-ink)}
.seg .s-pause{background:var(--s-pause);color:var(--s-pause-ink)}
.hint{font-size:.82rem;color:var(--ink-soft);margin:.35rem 0 0}
.links{display:flex;flex-direction:column;gap:.4rem}
.linkbtn{display:block;border:1.5px solid var(--ink);border-radius:5px;padding:.5rem .7rem;text-decoration:none;background:var(--paper)}
.linkbtn:hover{box-shadow:3px 3px 0 var(--ink)}
.linkbtn.off{opacity:.55;border-style:dashed;cursor:default;box-shadow:none}
.pinbtn{width:100%;margin-top:.6rem;border:1.5px solid var(--pin);color:var(--ink);background:none;border-radius:5px;padding:.5rem;cursor:pointer;font-weight:700}
.pinbtn[aria-pressed="true"]{background:var(--pin);color:#fff}
textarea{width:100%;min-height:9rem;border:1.5px solid var(--ink);border-radius:5px;padding:.55rem;background:var(--paper);resize:vertical;line-height:1.45}
label.f{display:block;font-size:.85rem;margin:.5rem 0 .2rem;color:var(--ink-soft)}
input[type=text],input[type=url]{width:100%;border:1.5px solid var(--ink);border-radius:5px;padding:.45rem .55rem;background:var(--paper)}
details summary{cursor:pointer;font-size:.9rem;margin-top:.6rem}
.saved{font-size:.8rem;color:var(--ink-soft);height:1.2em}
.row{display:flex;gap:.4rem;margin-top:.4rem}
.row input{flex:1}
.danger{border-color:var(--pin);color:var(--pin)}

dialog{border:2px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink);max-width:30rem;width:calc(100% - 2rem);padding:1.25rem}
dialog::backdrop{background:rgba(20,26,38,.45)}
dialog h2{font:700 1.5rem var(--font-label);margin:0 0 .5rem}
dialog p{font-size:.9rem;color:var(--ink-soft);margin:.3rem 0}
.dlg-actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}

@media (max-width:640px){
  .bar h1{font-size:1.5rem}
  main{padding:1rem .75rem 4rem}
  .chain{padding-left:.75rem}
  .legend{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  .drawer,.toggle span{transition:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <h1>Study map</h1>
    <span class="overall" id="overall"></span>
    <span class="spacer"></span>
    <button class="textbtn" id="settingsBtn" type="button">Settings</button>
  </div>
  <nav class="tabs" role="tablist" id="tabs" aria-label="Subjects"></nav>
</header>
<main id="main" tabindex="-1"></main>

<aside class="drawer" id="drawer" aria-labelledby="dTitle" aria-hidden="true">
  <button class="close" type="button" id="dClose" aria-label="Close details">✕</button>
  <div class="crumb" id="dCrumb"></div>
  <h2 id="dTitle"></h2>
  <div class="seg" id="dSeg" role="group" aria-label="Status"></div>
  <p class="hint" id="dCascade"></p>
  <button class="pinbtn" id="dPin" type="button" aria-pressed="false"></button>
  <h3>Links</h3>
  <div class="links" id="dLinks"></div>
  <details id="dEdit">
    <summary>Edit links for this box</summary>
    <label class="f" for="dCourseIn">Course link</label>
    <input type="url" id="dCourseIn" placeholder="https://…">
    <label class="f" for="dNotesIn">Notes link (leave blank to use the GitHub folder)</label>
    <input type="url" id="dNotesIn" placeholder="https://github.com/…">
  </details>
  <h3><label for="dSummary">Summary</label></h3>
  <textarea id="dSummary" placeholder="What did you learn? What's next?"></textarea>
  <div class="saved" id="dSaved" aria-live="polite"></div>
  <div id="dUnitTools"></div>
</aside>

<dialog id="settings">
  <h2>Settings</h2>
  <p>Notes links open the matching folder in your GitHub repo.</p>
  <label class="f" for="sOwner">GitHub username</label>
  <input type="text" id="sOwner" autocomplete="off" placeholder="your-username">
  <label class="f" for="sRepo">Repository name</label>
  <input type="text" id="sRepo" autocomplete="off">
  <label class="f" for="sBranch">Branch</label>
  <input type="text" id="sBranch" autocomplete="off">
  <p style="margin-top:1rem">Progress is saved in this browser. Export a backup to move it to another computer.</p>
  <div class="dlg-actions">
    <button class="textbtn" id="sSave" type="button">Save settings</button>
    <button class="textbtn" id="sExport" type="button">Export backup</button>
    <button class="textbtn" id="sImportBtn" type="button">Import backup</button>
    <input type="file" id="sImport" accept="application/json" hidden>
    <button class="textbtn danger" id="sReset" type="button">Reset all progress</button>
    <button class="textbtn" id="sClose" type="button">Close</button>
  </div>
</dialog>

function load(){

/* Renames saved ids when subjects/folders move (e.g. Differential Equations -> Math). Safe to run repeatedly. */
function migrate(o){
  const M=DATA.migrations||[]; if(!M.length||!o) return o;
  const rn=k=>{ for(const [a,b] of M) if(k===a) return b;
    for(const [a,b] of M) if(a.endsWith("/")&&k.startsWith(a)) return b+k.slice(a.length); return k; };
  for(const f of ["status","focus","summary","links","custom","open"]){

  if(o.tab) o.tab=rn(o.tab);

}
function lessonsOf(id){
  const e=IDX[id]; if(!e) return [];
  if(e.type==="lesson") return [e.node];
  if(e.type==="unit") return e.node._all;
  if(e.type==="lane") return e.node.units.flatMap(u=>u._all);
  if(e.type==="subject") return e.node.lanes.flatMap(l=>l.units.flatMap(u=>u._all));
  return [];
}
function own(id){return S.status[id]||"ns";}
function statusOf(id){
  const e=IDX[id]; if(!e) return "ns";
  if(e.type==="lesson") return own(id);
  const ls=lessonsOf(id); if(!ls.length) return own(id);
  const st=ls.map(l=>own(l.id));
  if(st.every(s=>s===st[0])) return st[0];
  if(st.every(s=>s==="done"||s==="pause")) return "pause";
  return "ip";
}
function counts(id){
  const ls=lessonsOf(id); const c={ns:0,ip:0,done:0,pause:0,total:ls.length};
  ls.forEach(l=>c[own(l.id)]++); return c;
}
function setStatus(id,k){
  const e=IDX[id];
  if(e.type==="lesson"){S.status[id]=k;}
  else{S.status[id]=k; lessonsOf(id).forEach(l=>S.status[l.id]=k);}
  save(); render(); openDrawer(id,true);
}

/* ---------- links ---------- */
function courseUrl(id){
  const e=IDX[id], o=S.links[id]||{};
  if(o.course) return o.course;
  if(e.node.url) return e.node.url;
  if(e.type==="lesson") return e.unit.url || e.sub.url;
  return e.sub.url||null;
}
function notesUrl(id){
  const e=IDX[id], o=S.links[id]||{};
  if(o.notes) return o.notes;
  const {owner,repo,branch}=S.settings; if(!owner||!repo) return null;
  const base=`https://github.com/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
  const path = e.type==="lane" ? (e.node.path||e.sub.path) : e.node.path;
  if(e.node.custom) return `${base}/new/${branch}/${encodeURI(e.unit.path)}?filename=${encodeURIComponent(e.node.slug+"/README.md")}`;
  return `${base}/tree/${encodeURIComponent(branch)}/${encodeURI(path)}`;
}

/* ---------- rendering ---------- */
const $=s=>document.querySelector(s);
function h(tag,attrs={},...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false) continue;
    if(k==="class") el.className=v; else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(k==="html") el.innerHTML=v; else el.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null) continue; el.append(c.nodeType?c:document.createTextNode(c)); }
  return el;
}
let selected=null;
function box(id,extraClass=""){
  const e=IDX[id], st=statusOf(id), n=e.node;
  const kids=[h("span",{class:"g","aria-hidden":"true"},G[st])];
  const t=h("span",{class:"t"});
  if(e.type!=="lesson"&&n.code) t.append(h("span",{class:"code"},n.code));
  t.append(n.title);
  if(e.type!=="lesson"){const c=counts(id); if(c.total) t.append(" ",h("span",{class:"count"},`${c.done}/${c.total}`));}
  kids.push(t);
  if(S.focus[id]) kids.push(h("span",{class:"pin",title:"In focus"},"★"));
  return h("button",{type:"button",class:`box s-${st} ${extraClass} ${selected===id?"selected":""}`,"data-id":id,
    "aria-label":`${n.title}. ${LABEL[st]}${S.focus[id]?". In focus":""}`,
    onclick:(ev)=>{ if(ev.shiftKey){cycle(id);} else openDrawer(id);} },kids);
}
function cycle(id){const order=["ns","ip","done","pause"]; setStatus(id,order[(order.indexOf(statusOf(id))+1)%4]);}
function miniBar(id){
  const c=counts(id); if(!c.total) return null;
  const seg=(k,v)=>v?h("i",{style:`width:${v/c.total*100}%;background:var(--s-${k})`}):null;
  return h("div",{class:"bar-mini","aria-hidden":"true"},seg("done",c.done),seg("ip",c.ip),seg("pause",c.pause));
}
function pct(id){const c=counts(id); return c.total?Math.round(c.done/c.total*100):0;}
function legend(){
  return h("div",{class:"legend","aria-label":"Status key"},STATUSES.map(s=>h("span",{},
    h("i",{class:"swatch",style:`background:var(--s-${s.k});${s.k==="ns"?"border-style:dashed":""}`}),`${s.g} ${s.label}`)),
    h("span",{},h("b",{style:"color:var(--pin)"},"★")," Focus"));
}

function renderTabs(){
  const nav=$("#tabs"); const keep=nav.scrollLeft; nav.innerHTML="";
  const all=[...DATA.subjects.map(s=>({id:s.id,label:s.name,pct:pct(s.id)})),{id:"__focus",label:"Focus",focus:true}];
  for(const t of all){
    const sel=S.tab===t.id;
    const n=Object.keys(S.focus).filter(k=>S.focus[k]&&IDX[k]).length;
    nav.append(h("button",{role:"tab",type:"button",class:`tab ${t.focus?"focus-tab":""}`,"aria-selected":sel?"true":"false",
      tabindex:sel?"0":"-1",onclick:()=>{S.tab=t.id;save();render();$("#main").focus({preventScroll:true});}},
      t.focus?h("span",{class:"dot","aria-hidden":"true"},"★"):null, t.label,
      h("span",{class:"pct"}, t.focus?String(n):`${t.pct}%`)));
  }
  nav.scrollLeft=keep;
  if(!keep){const sel=nav.querySelector('[aria-selected="true"]'); if(sel&&sel.offsetLeft+sel.offsetWidth>nav.clientWidth) nav.scrollLeft=sel.offsetLeft-16;}
  nav.onkeydown=(ev)=>{
    if(!["ArrowLeft","ArrowRight"].includes(ev.key)) return;
    const tabs=[...nav.children], i=tabs.indexOf(document.activeElement); if(i<0) return;
    const j=(i+(ev.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length; tabs[j].click(); nav.children[j].focus();
  };
}
function renderSubject(sub){
  const m=$("#main"); m.innerHTML="";
  const c=counts(sub.id);
  m.append(h("div",{class:"subject-head"},h("h2",{},sub.name),
    h("span",{class:"meta"},`${c.done} of ${c.total} complete, ${c.ip} in progress`),
    sub.url?h("a",{class:"meta",href:sub.url,target:"_blank",rel:"noopener"},"Open course"):null, legend()));
  if(sub.layout==="flow"){
    const titled=sub.lanes.filter(l=>l.title);
    if(titled.length>1) m.append(h("div",{class:"stack-tools"},
      h("button",{class:"textbtn",type:"button",onclick:()=>{titled.forEach(l=>S.open[l.id]=true);save();render();}},"Expand all"),
      h("button",{class:"textbtn",type:"button",onclick:()=>{titled.forEach(l=>S.open[l.id]=false);save();render();}},"Collapse all")));
    for(const lane of sub.lanes){
      const open=S.open[lane.id]!==false;
      const flowId="f-"+lane.id.replace(/[^\w]/g,"_");
      const L=h("section",{class:`lane ${open?"open":""}`});
      if(lane.title){
        const b=box(lane.id,"unitbox"); const bar=miniBar(lane.id); if(bar) b.querySelector(".t").append(bar);
        L.append(h("div",{class:"lane-head"},
          h("button",{type:"button",class:"toggle","aria-expanded":open?"true":"false","aria-controls":flowId,
            "aria-label":`${open?"Collapse":"Expand"} ${lane.title}`,onclick:()=>{S.open[lane.id]=!open;save();render();}},
            h("span",{"aria-hidden":"true"},"›")), b));
      }
      const flow=h("div",{class:"flow",id:flowId,hidden:(lane.title&&!open)?true:null});
      for(const u of lane.units){
        flow.append(h("div",{class:"stage"},box(u.id,"unitbox"),h("div",{class:"lessons"},u._all.map(l=>box(l.id)))));
      }
      L.append(flow); m.append(L);
    }
  } else {
    const units=sub.lanes.flatMap(l=>l.units);
    m.append(h("div",{class:"stack-tools"},
      h("button",{class:"textbtn",type:"button",onclick:()=>{units.forEach(u=>S.open[u.id]=true);save();render();}},"Expand all"),
      h("button",{class:"textbtn",type:"button",onclick:()=>{units.forEach(u=>S.open[u.id]=false);save();render();}},"Collapse all")));
    for(const u of units){
      const open=!!S.open[u.id];
      const chainId="c-"+u.id.replace(/[^\w]/g,"_");
      const chain=h("div",{class:"chain",id:chainId});
      u._all.forEach((l,i)=>{ if(i) chain.append(h("span",{class:"arrow","aria-hidden":"true"},"→")); chain.append(box(l.id)); });
      const b=box(u.id,"unitbox"); const bar=miniBar(u.id); if(bar) b.querySelector(".t").append(bar);
      m.append(h("section",{class:`unit ${open?"open":""}`},
        h("div",{class:"unit-head"},
          h("button",{type:"button",class:"toggle","aria-expanded":open?"true":"false","aria-controls":chainId,
            "aria-label":`${open?"Collapse":"Expand"} ${u.title}`,
            onclick:()=>{S.open[u.id]=!open;save();render();}},h("span",{"aria-hidden":"true"},"›")), b),
        chain));
    }
  }
}
function renderFocus(){
  const m=$("#main"); m.innerHTML="";
  const ids=Object.keys(S.focus).filter(k=>S.focus[k]&&IDX[k]);
  m.append(h("div",{class:"subject-head"},h("h2",{},"Focus"),h("span",{class:"meta"},`${ids.length} box${ids.length===1?"":"es"} across all subjects`),legend()));
  if(!ids.length){
    m.append(h("div",{class:"empty"},h("p",{style:"margin:0"},"Nothing in focus yet. Open any box on a subject page and choose ",h("b",{},"Add to focus"),". It will show up here.")));
    return;
  }
  for(const sub of DATA.subjects){
    const mine=ids.filter(id=>IDX[id].sub.id===sub.id); if(!mine.length) continue;
    const list=h("div",{class:"focus-list"});
    for(const id of mine){
      const e=IDX[id]; const crumb=[e.lane&&e.lane.title, e.unit&&e.unit.title].filter(Boolean).join(" › ");
      list.append(h("div",{class:"fcard"}, crumb?h("div",{class:"crumb"},crumb):null, box(id),
        S.summary[id]?h("p",{},S.summary[id]):null));
    }
    m.append(h("section",{class:"focus-group"},h("h3",{},sub.name),list));
  }
}
function render(){
  buildIndex();
  renderTabs();
  let d=0,t=0; DATA.subjects.forEach(s=>{const c=counts(s.id);d+=c.done;t+=c.total;});
  $("#overall").textContent=`${d} of ${t} boxes complete`;
  if(S.tab==="__focus") renderFocus();
  else renderSubject(DATA.subjects.find(s=>s.id===S.tab)||DATA.subjects[0]);
}

/* ---------- drawer ---------- */
const drawer=$("#drawer");
let saveTimer;
function openDrawer(id,keepFocus){
  const e=IDX[id]; if(!e){closeDrawer();return;}
  selected=id;
  document.querySelectorAll(".box.selected").forEach(b=>b.classList.remove("selected"));
  document.querySelectorAll(`.box[data-id="${CSS.escape(id)}"]`).forEach(b=>b.classList.add("selected"));
  const crumb=[e.sub.name, e.lane&&e.lane.title&&e.type!=="lane"?e.lane.title:null, e.unit?e.unit.title:null].filter(Boolean).join(" › ");
  $("#dCrumb").textContent=crumb; $("#dTitle").textContent=e.node.title;
  const st=statusOf(id), seg=$("#dSeg"); seg.innerHTML="";
  STATUSES.forEach(s=>seg.append(h("button",{type:"button",class:`s-${s.k}`,"aria-pressed":st===s.k?"true":"false",
    onclick:()=>setStatus(id,s.k)},h("span",{"aria-hidden":"true"},s.g),s.label)));
  const n=lessonsOf(id).length;
  $("#dCascade").textContent = e.type==="lesson" ? "Tip: shift-click any box to cycle its status."
    : `Setting a status here applies it to all ${n} ${e.sub.id==="career-projects"?"tasks":"lessons"} inside.`;
  const pin=$("#dPin"); pin.setAttribute("aria-pressed",S.focus[id]?"true":"false");
  pin.textContent=S.focus[id]?"★ In focus — remove":"☆ Add to focus";
  pin.onclick=()=>{ if(S.focus[id]) delete S.focus[id]; else S.focus[id]=true; save(); render(); openDrawer(id,true); };
  const L=$("#dLinks"); L.innerHTML="";
  const cu=courseUrl(id), nu=notesUrl(id);
  L.append(cu?h("a",{class:"linkbtn",href:cu,target:"_blank",rel:"noopener"},"Open course")
             :h("span",{class:"linkbtn off"},"No course link yet — add one below"));
  L.append(nu?h("a",{class:"linkbtn",href:nu,target:"_blank",rel:"noopener"}, e.node.custom&&!(S.links[id]||{}).notes?"Create notes page on GitHub":"Open notes on GitHub")
             :h("button",{type:"button",class:"linkbtn off",style:"cursor:pointer;text-align:left",onclick:openSettings},"Set your GitHub username to enable notes links"));
  const o=S.links[id]||{};
  const ci=$("#dCourseIn"), ni=$("#dNotesIn");
  ci.value=o.course||""; ni.value=o.notes||"";
  ci.onchange=()=>{S.links[id]=Object.assign({},S.links[id],{course:ci.value.trim()});save();openDrawer(id,true);};
  ni.onchange=()=>{S.links[id]=Object.assign({},S.links[id],{notes:ni.value.trim()});save();openDrawer(id,true);};
  const ta=$("#dSummary"); ta.value=S.summary[id]||""; $("#dSaved").textContent="";
  ta.oninput=()=>{S.summary[id]=ta.value; if(!ta.value) delete S.summary[id]; clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{save();$("#dSaved").textContent="Saved";},400);};
  const tools=$("#dUnitTools"); tools.innerHTML="";
  if(e.type==="unit"){
    const inp=h("input",{type:"text",id:"addIn",placeholder:"Lesson or task name"});
    const add=()=>{const v=inp.value.trim(); if(!v) return;
      const list=S.custom[id]||(S.custom[id]=[]); let sl=slug(v), k=2; const used=new Set(e.node._all.map(l=>l.path.split("/").pop()));
      while(used.has(sl)) sl=slug(v)+"-"+(k++);
      list.push({id:id+"/"+sl,title:v,slug:sl,url:null}); save(); render(); openDrawer(id,true);};
    inp.addEventListener("keydown",ev=>{if(ev.key==="Enter")add();});
    tools.append(h("h3",{},h("label",{for:"addIn"},"Add a box to this unit")),h("div",{class:"row"},inp,h("button",{class:"textbtn",type:"button",onclick:add},"Add")));
  }
  if(e.node.custom){
    tools.append(h("button",{class:"textbtn danger",type:"button",style:"margin-top:1rem",onclick:()=>{
      S.custom[e.unit.id]=(S.custom[e.unit.id]||[]).filter(c=>c.id!==id);
      delete S.status[id]; delete S.focus[id]; delete S.summary[id]; delete S.links[id];
      save(); closeDrawer(); render();}},"Remove this box"));
  }
  drawer.classList.add("open"); drawer.setAttribute("aria-hidden","false");
  if(!keepFocus) $("#dClose").focus();
}
function closeDrawer(){
  drawer.classList.remove("open"); drawer.setAttribute("aria-hidden","true");
  const prev=selected; selected=null;
  document.querySelectorAll(".box.selected").forEach(b=>b.classList.remove("selected"));
  const b=prev&&document.querySelector(`.box[data-id="${CSS.escape(prev)}"]`); if(b) b.focus();
}
$("#dClose").onclick=closeDrawer;
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&drawer.classList.contains("open")&&!$("#settings").open) closeDrawer();});

/* ---------- settings ---------- */
const dlg=$("#settings");
function openSettings(){ $("#sOwner").value=S.settings.owner; $("#sRepo").value=S.settings.repo; $("#sBranch").value=S.settings.branch; dlg.showModal(); }
$("#settingsBtn").onclick=openSettings;
$("#sClose").onclick=()=>dlg.close();
$("#sSave").onclick=()=>{S.settings={owner:$("#sOwner").value.trim(),repo:$("#sRepo").value.trim()||DATA.repo,branch:$("#sBranch").value.trim()||"main"};
  save(); dlg.close(); render(); if(selected) openDrawer(selected,true);};
$("#sExport").onclick=()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=h("a",{href:URL.createObjectURL(blob),download:`study-map-backup-${new Date().toISOString().slice(0,10)}.json`});
  document.body.append(a); a.click(); a.remove();
};
$("#sImportBtn").onclick=()=>$("#sImport").click();
$("#sImport").onchange=async(ev)=>{
  const f=ev.target.files[0]; if(!f) return;
  try{ const o=JSON.parse(await f.text()); S=Object.assign(blank(),migrate(o)); save(); dlg.close(); render(); }
  catch(e){ alert("That file isn't a Study map backup. Choose a .json file made with Export backup."); }
  ev.target.value="";
};
$("#sReset").onclick=()=>{ if(confirm("Reset all statuses, summaries, focus tags and added boxes? Your GitHub settings stay.")){
  const keep=S.settings; S=blank(); S.settings=keep; save(); closeDrawer(); render(); } };

render();
if(!S.settings.owner) setTimeout(openSettings,300);
</script>
</body>
